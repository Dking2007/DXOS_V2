[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "dx-platform-kit"
version = "0.2.2"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.118.0", "uvicorn[standard]==0.37.0", "SQLAlchemy==2.0.43",
  "psycopg==3.2.10", "alembic==1.16.5", "pydantic-settings==2.11.0",
  "httpx==0.28.1", "PyJWT[crypto]==2.10.1", "cryptography==46.0.2",
  "jsonschema==4.25.1", "boto3==1.40.44", "python-multipart==0.0.20"
]

[tool.setuptools.packages.find]
where = ["src"]
