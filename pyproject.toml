[tool.pytest.ini_options]
testpaths = ["tests", "packages/flowkit/tests", "services/core-api/tests", "services/workspace-api/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
