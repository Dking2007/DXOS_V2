<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 890" width="1120" height="890" role="img" aria-labelledby="tt dd">
<title id="tt">Desktiny: kiến trúc hai tầng và đường đi của một yêu cầu</title>
<desc id="dd">Người dùng đi qua cổng Nginx (giới hạn tần suất, CSP, /internal/ trả 404). Cổng chia đường: / tới Workspace web, /workspace/v1/ tới workspace-api và workspace-worker, /console/ tới Core admin, /office/ tới ONLYOFFICE tùy chọn, /identity/ tới Keycloak, /core/v1/ tới core-api. Workspace gọi Core chỉ qua HTTP /core/v1/ bằng token OIDC. Core gồm core-api và core-worker: principal và ACL, schema và record có phiên bản, tệp có phiên bản kèm SHA-256, workflow và human task, nhật ký kiểm toán nối chuỗi băm; quét tệp bằng ClamAV khi bật. Lưu trữ: PostgreSQL với ba CSDL tách riêng dx_identity, dx_workspace, dx_core; RustFS (S3) giữ byte tệp; Valkey được cấp sẵn nhưng mã chưa dùng. Bên phải: máy chủ plugin nhận sự kiện ký HMAC và gọi lại API plugin bằng token có phạm vi; hệ thống ngoài như thiết bị, cổng nộp hồ sơ chỉ nói chuyện với máy chủ plugin. Sáu bước được đánh số và lần lượt sáng lên.</desc>
