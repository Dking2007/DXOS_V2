<!-- chú thích từng bước -->
<rect x="20" y="778" width="1080" height="44" rx="10" fill="#fff" stroke="#CBD5E1"/>
<text x="40" y="806" class="cap"><tspan class="b">1 · Qua cổng:</tspan> giới hạn tần suất, gắn CSP, /internal/ trả 404; /workspace/v1/ tới workspace-api.</text>
<text x="40" y="806" class="cap s2"><tspan class="b">2 · Đăng nhập:</tspan> Keycloak qua /identity/, OIDC + PKCE; trình duyệt chỉ giữ cookie phiên, không giữ token.</text>
<text x="40" y="806" class="cap s3"><tspan class="b">3 · Workspace gọi Core</tspan> chỉ qua HTTP /core/v1/ bằng token OIDC; mỗi tầng một CSDL, không SQL xuyên tầng.</text>
<text x="40" y="806" class="cap s4"><tspan class="b">4 · Core lưu</tspan> record vào dx_core, byte tệp vào RustFS, mỗi phiên bản kèm SHA-256; quét ClamAV khi bật.</text>
<text x="40" y="806" class="cap s5"><tspan class="b">5 · workspace-worker</tspan> gửi sự kiện plugin ký HMAC; máy chủ plugin gọi lại API plugin bằng token có phạm vi.</text>
<text x="40" y="806" class="cap s6"><tspan class="b">6 · Core admin</tspan> gọi thẳng /core/v1/ như mọi client; ONLYOFFICE (tùy chọn) chỉ nói chuyện với workspace-api.</text>
<text x="40" y="806" class="tinh"><tspan class="b">Số 1–6:</tspan> qua cổng · đăng nhập · Workspace gọi Core · Core lưu · plugin · Core admin (giải thích dưới sơ đồ).</text>

