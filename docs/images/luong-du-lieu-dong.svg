<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 876" width="1120" height="876" role="img" aria-labelledby="tt dd">
<title id="tt">Desktiny: dữ liệu đi đâu</title>
<desc id="dd">Ba cột: người dùng làm gì, dịch vụ nào ghi, dữ liệu nằm ở đâu. Đăng nhập đi tới Keycloak, tài khoản, mật khẩu đã băm và khóa TOTP nằm trong CSDL dx_identity. Trình, duyệt hồ sơ, giao việc, nhắn tin đi tới workspace-api; tổ chức, việc, hồ sơ, snapshot đã trình, quyết định, tên tệp, thư mục, chia sẻ và outbox nằm trong dx_workspace. Workspace gọi core-api qua HTTP /core/v1/, không đọc CSDL của Core; principal, ACL, schema và record có phiên bản, phiên bản tệp kèm SHA-256, run và human task, nhật ký kiểm toán nối chuỗi băm nằm trong dx_core. Byte tệp nằm trong RustFS (S3), bucket dx-files. Khi xem trước tệp, dx-piivn đếm dữ liệu cá nhân và trả bản đã che, giá trị tìm thấy không được lưu. Thiết bị và người dân gửi tới máy chủ plugin; dữ liệu plugin nằm trong SQLite riêng của từng plugin. Khi hồ sơ kết thúc, sự kiện ký HMAC tới plugin Lưu trữ lịch sử, bản đã che được ghi vào tệp archive/YYYY-MM.jsonl, mỗi dòng nối sha256 với dòng trước.</desc>
