<rect x="20" y="772" width="1080" height="44" rx="10" fill="#fff" stroke="#CBD5E1"/>
<text x="40" y="800" class="cap"><tspan class="b">Đăng nhập:</tspan> Keycloak giữ tài khoản, mật khẩu đã băm, khóa TOTP trong dx_identity; trình duyệt chỉ có cookie phiên.</text>
<text x="40" y="800" class="cap s2"><tspan class="b">Hồ sơ:</tspan> Workspace ghi hồ sơ, snapshot, quyết định vào dx_workspace; dữ liệu biểu mẫu, run quy trình ở dx_core.</text>
<text x="40" y="800" class="cap s3"><tspan class="b">Tệp:</tspan> byte vào RustFS; phiên bản, SHA-256, quyền ở dx_core; tên, thư mục, chia sẻ ở dx_workspace.</text>
<text x="40" y="800" class="cap s4"><tspan class="b">Xem trước:</tspan> dx-piivn đếm CCCD, điện thoại, e-mail… và che; giá trị tìm thấy không ghi log, không lưu.</text>
<text x="40" y="800" class="cap s5"><tspan class="b">Plugin:</tspan> thiết bị, người dân gửi tới máy chủ plugin; dữ liệu nằm trong SQLite riêng của plugin đó.</text>
<text x="40" y="800" class="cap s6"><tspan class="b">Lưu trữ:</tspan> hồ sơ kết thúc, sự kiện ký HMAC tới plugin Lưu trữ lịch sử; một dòng JSONL đã che, nối sha256.</text>
<text x="40" y="800" class="tinh"><tspan class="b">Đọc theo hàng:</tspan> thao tác bên trái, dịch vụ ghi ở giữa, nơi dữ liệu nằm bên phải.</text>

