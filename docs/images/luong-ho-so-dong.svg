<!-- chú thích từng bước -->
<rect x="20" y="632" width="1080" height="44" rx="10" fill="#fff" stroke="#CBD5E1"/>
<g font-size="15">
<text x="40" y="660" class="cap"><tspan class="b">1 ·</tspan> Nhân viên điền biểu mẫu (trường ẩn/hiện theo điều kiện) và đính kèm tệp.</text>
<text x="40" y="660" class="cap d1"><tspan class="b">2 ·</tspan> Core kiểm định dạng, chữ ký nội dung, quét ClamAV nếu bật; byte vào RustFS, phiên bản + SHA-256 vào dx_core.</text>
<text x="40" y="660" class="cap d2"><tspan class="b">3 ·</tspan> Nhân viên bấm Trình.</text>
<text x="40" y="660" class="cap d3"><tspan class="b">4 ·</tspan> Workspace ghim snapshot biểu mẫu, phiên bản tệp và quy trình, ghi outbox cùng giao dịch.</text>
<text x="40" y="660" class="cap d4"><tspan class="b">5 ·</tspan> workspace-worker đặt hold lên tệp đã trình, khởi chạy run; bước duyệt là một human task của Core.</text>
<text x="40" y="660" class="cap d5"><tspan class="b">6 ·</tspan> Human task thành việc trong Cần phê duyệt của đúng người, kèm thông báo.</text>
<text x="40" y="660" class="cap d6"><tspan class="b">7 ·</tspan> Trưởng phòng duyệt, trả lại, từ chối hoặc xin ý kiến.</text>
<text x="40" y="660" class="cap d7"><tspan class="b">8 ·</tspan> Quyết định ghi ở Workspace trước; người dùng không gọi được Core để tự đặt hồ sơ thành đã duyệt.</text>
<text x="40" y="660" class="cap d8"><tspan class="b">9 ·</tspan> Core hoàn tất human task, ghi nhật ký: mỗi dòng chứa SHA-256 của dòng trước (prev_hash).</text>
<text x="40" y="660" class="cap d9"><tspan class="b">10 ·</tspan> Nhân viên thấy kết quả và lịch sử xử lý trên tab Quy trình.</text>
<text x="40" y="660" class="tinh"><tspan class="b">1–10:</tspan> thứ tự các bước; ô xanh lá là nơi ghi dữ liệu, ô tím là nơi giữ byte tệp.</text>
</g>

