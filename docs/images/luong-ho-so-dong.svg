.st{fill:#fff;stroke:#94A3B8;stroke-width:1.5}
.wr{fill:#E8F6EE;stroke:#A7DBBC}.fv{fill:#F0ECFB;stroke:#D6CDF3}
.l{fill:none;stroke-width:2.2}
.rq{stroke:#2563EB}.gw{stroke:#15803D}.ev{stroke:#92600A}.fi{stroke:#5D43B5}
.bd circle{fill:#1E3A5F}.bd text{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
.ring{fill:none;stroke:#F1B862;stroke-width:5}
.cap,.ring{opacity:0;animation:hien 10s linear infinite}
@keyframes hien{0%,9.4%{opacity:1}10%,100%{opacity:0}}
.d1{animation-delay:1s}.d2{animation-delay:2s}.d3{animation-delay:3s}.d4{animation-delay:4s}.d5{animation-delay:5s}.d6{animation-delay:6s}.d7{animation-delay:7s}.d8{animation-delay:8s}.d9{animation-delay:9s}
.dot{stroke:#fff;stroke-width:2}
.tinh{display:none}
@media (prefers-reduced-motion:reduce){.dong,.cap,.ring{display:none}.tinh{display:inline}}
</style>
