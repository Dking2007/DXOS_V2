<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 780" width="1120" height="780" role="img" aria-labelledby="tt dd">
<title id="tt">Desktiny: một hồ sơ trình duyệt đi qua bốn làn</title>
<desc id="dd">Bốn làn từ trên xuống: Nhân viên, Workspace, Core, Trưởng phòng; thời gian chạy từ trái sang phải qua 10 bước. 1 Nhân viên điền biểu mẫu, đính kèm tệp. 2 Core lưu tệp có phiên bản: byte vào RustFS, SHA-256 vào dx_core. 3 Nhân viên bấm Trình. 4 Workspace ghim snapshot biểu mẫu, phiên bản tệp, phiên bản quy trình và ghi outbox vào dx_workspace. 5 workspace-worker đặt hold lên tệp và khởi chạy run trên Core; bước duyệt là một human task, lưu ở dx_core. 6 Workspace tạo việc duyệt và gửi thông báo. 7 Trưởng phòng duyệt, trả lại, từ chối hoặc xin ý kiến. 8 Quyết định được ghi ở Workspace trước. 9 Core hoàn tất human task và ghi nhật ký kiểm toán, mỗi dòng nối với dòng trước bằng SHA-256. 10 Nhân viên xem kết quả và lịch sử ở tab Quy trình. Các bước lần lượt sáng lên, vòng 10 giây.</desc>
