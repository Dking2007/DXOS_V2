name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Đóng gói nguồn tar.gz và SHA256SUMS
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="dxos-${VERSION}/" -o "dist/dxos-${VERSION}.tar.gz" "${GITHUB_REF_NAME}"
          (cd dist && sha256sum "dxos-${VERSION}.tar.gz" > SHA256SUMS)
      - name: Lấy ghi chú từ CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="[${VERSION}]" 'index($0,"## "v)==1{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > RELEASE_NOTES.md
          printf '\n---\nTệp chính: `dxos-%s.tar.gz` (kèm `SHA256SUMS`). Mục "Source code (zip)" do GitHub tự thêm, không phải bản phân phối chính thức.\n' "${VERSION}" >> RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "dist/dxos-${VERSION}.tar.gz" dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
