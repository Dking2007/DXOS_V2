<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phiếu tiếp nhận</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="out" class="muted">Đang tải…</div>
    <script type="module">
      import { connect } from './desktiny-plugin-sdk.js'
      const out = document.getElementById('out')
      const desktiny = connect()
      const date = (value) => (value ? new Date(value).toLocaleDateString('vi-VN') : '—')
      try {
        const context = await desktiny.context
        // Read with the viewer's own rights, through a short-lived session token Desktiny hands the frame.
        const dossier = await desktiny.api(`/cases/${context.record.case_id}`)
        const rows = [
          ['Mã hồ sơ', dossier.code],
          ['Thủ tục', dossier.form.name],
          ['Người nộp', dossier.owner?.display_name ?? '—'],
          ['Ngày tiếp nhận', date(dossier.created_at)],
          ['Hẹn trả', date(dossier.due_at)],
        ]
        const list = document.createElement('dl')
        for (const [label, value] of rows) {
          const term = document.createElement('dt')
          term.textContent = label
          const detail = document.createElement('dd')
          detail.textContent = value
          list.append(term, detail)
        }
        out.className = ''
        out.replaceChildren(list)
      } catch (error) {
        out.className = 'error'
        out.textContent = error.message
      }
    </script>
  </body>
</html>
