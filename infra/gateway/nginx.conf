worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log safe;

    server {
        listen 80;
        server_name _;
        client_max_body_size 52m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        set $core http://core-api:8001;
        set $workspace http://workspace-api:8002;
        set $identity http://identity:8080;
        set $editor http://onlyoffice;
        set $web http://workspace-web;
        set $console http://core-admin;

        location /core/v1/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass $core$request_uri;
        }
        location /workspace/v1/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass $workspace$request_uri;
        }
        location /identity/ {
            limit_req zone=auth burst=60 nodelay;
            proxy_pass $identity$request_uri;
        }
        location = /office { return 301 /office/; }
        location /office/ {
            rewrite ^/office/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host/office;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_pass $editor$uri$is_args$args;
        }
        location = /console { return 301 /console/; }
        location /console/ {
            rewrite ^/console/(.*)$ /$1 break;
            proxy_pass $console$uri$is_args$args;
        }
        # Internal actions and health endpoints are intentionally not public routes.
        location /internal/ { return 404; }
        location / {
            proxy_pass $web$request_uri;
        }
    }
}
